# Training Configuration
# This file contains all hyperparameters and training settings

# =============================================================================
# Model Configuration
# =============================================================================
model:
  architecture: "resnet50"  # Options: resnet18, resnet34, resnet50, resnet101, custom
  num_classes: 10
  pretrained: true
  pretrained_weights: "IMAGENET1K_V2"
  dropout_rate: 0.2
  
  # Custom architecture settings (used when architecture: "custom")
  custom:
    hidden_dims: [512, 256, 128]
    activation: "relu"
    batch_norm: true

# =============================================================================
# Training Configuration
# =============================================================================
training:
  epochs: 100
  batch_size: 32
  gradient_accumulation_steps: 1
  
  # Optimizer settings
  optimizer:
    type: "adamw"  # Options: adam, adamw, sgd, rmsprop
    learning_rate: 0.001
    weight_decay: 0.01
    betas: [0.9, 0.999]
    momentum: 0.9  # For SGD
    
  # Learning rate scheduler
  scheduler:
    type: "cosine"  # Options: cosine, step, exponential, plateau, one_cycle
    warmup_epochs: 5
    warmup_start_lr: 0.0001
    min_lr: 0.000001
    # Step scheduler settings
    step_size: 30
    gamma: 0.1
    # Plateau scheduler settings
    patience: 10
    factor: 0.5
    
  # Early stopping
  early_stopping:
    enabled: true
    patience: 15
    min_delta: 0.001
    monitor: "val_loss"
    mode: "min"
    
  # Gradient clipping
  gradient_clipping:
    enabled: true
    max_norm: 1.0
    
  # Mixed precision training
  mixed_precision:
    enabled: true
    dtype: "float16"  # Options: float16, bfloat16

# =============================================================================
# Distributed Training Configuration
# =============================================================================
distributed:
  enabled: false
  backend: "nccl"  # Options: nccl, gloo, mpi
  world_size: 2
  find_unused_parameters: false
  sync_batch_norm: true

# =============================================================================
# Checkpointing Configuration
# =============================================================================
checkpointing:
  enabled: true
  save_dir: "./checkpoints"
  frequency: 5  # Save every N epochs
  keep_last: 3  # Keep only last N checkpoints
  save_best: true
  monitor: "val_loss"
  mode: "min"  # min for loss, max for accuracy
  resume_from: null  # Path to checkpoint to resume from

# =============================================================================
# Data Loader Configuration
# =============================================================================
dataloader:
  num_workers: 4
  pin_memory: true
  drop_last: false
  prefetch_factor: 2
  persistent_workers: true

# =============================================================================
# Validation Configuration
# =============================================================================
validation:
  frequency: 1  # Validate every N epochs
  batch_size: 64

# =============================================================================
# Loss Function Configuration
# =============================================================================
loss:
  type: "cross_entropy"  # Options: cross_entropy, focal, label_smoothing
  label_smoothing: 0.1
  class_weights: null  # List of class weights or null for equal weights
  focal_gamma: 2.0  # For focal loss

# =============================================================================
# Regularization
# =============================================================================
regularization:
  l1_weight: 0.0
  l2_weight: 0.0
  dropout: 0.2

# =============================================================================
# Seeds for Reproducibility
# =============================================================================
seed:
  global_seed: 42
  deterministic: true
  benchmark: false
