<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greenhouse 3D Viewer</title>

    <!-- PWA Metadata -->
    <meta name="theme-color" content="#1a1a1a">
    <meta name="description" content="Interactive 3D visualization of a greenhouse with sensors">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icons/icon-192x192.png">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">

    <!-- Import Maps for ES Modules -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- App Files -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="container"></div>

    <div id="loading">
        <div class="loading-content">
            <div class="spinner"></div>
            <p>Loading 3D model...</p>
        </div>
    </div>

    <!-- Left Gauge Panel -->
    <div id="gaugesLeft" class="gauge-panel gauge-panel-left">
        <canvas id="gaugeTemp" class="gauge-canvas" width="180" height="200"></canvas>
        <canvas id="gaugeHumidity" class="gauge-canvas" width="180" height="200"></canvas>
        <canvas id="gaugeSoil" class="gauge-canvas" width="180" height="200"></canvas>
    </div>

    <!-- Right Gauge Panel -->
    <div id="gaugesRight" class="gauge-panel gauge-panel-right">
        <canvas id="gaugeGas" class="gauge-canvas" width="180" height="200"></canvas>
        <canvas id="gaugeWater" class="gauge-canvas" width="180" height="200"></canvas>
        <canvas id="gaugePH" class="gauge-canvas" width="180" height="200"></canvas>
    </div>

    <div id="controls">
        <div id="userInfo" class="user-info">
            <span id="userName">User</span>
        </div>
        <button class="btn" id="resetButton">
            <span>↻</span>
            <span>Reset View</span>
        </button>
        <button class="btn" id="rotateButton">
            <span id="rotateIcon">⏸</span>
            <span id="rotateText">Pause</span>
        </button>
        <button class="btn" id="logoutButton">
            <span>⎋</span>
            <span>Logout</span>
        </button>
    </div>

    <!-- Sensor Details Popup -->
    <div class="popup-overlay" id="sensorPopupOverlay"></div>
    <div class="popup" id="sensorPopup">
        <div class="popup-header">
            <div class="popup-icon" id="popupIcon"></div>
            <h2 class="popup-title" id="popupTitle">Sensor</h2>
        </div>
        <div class="popup-content">
            <div class="sensor-value" id="sensorValue">--</div>
            <div class="sensor-status">
                <div class="status-dot"></div>
                <div class="status-text" id="statusText">Online</div>
            </div>
            <div class="sensor-info">
                <div class="info-item">
                    <div class="info-label">Sensor ID</div>
                    <div class="info-value" id="sensorId">--</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Position</div>
                    <div class="info-value" id="sensorPosition">--</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Last Update</div>
                    <div class="info-value" id="lastUpdate">--</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Battery</div>
                    <div class="info-value" id="batteryLevel">--</div>
                </div>
            </div>
            <!-- Actuator Controls (shown only for actuators) -->
            <div id="actuatorControlsInPopup" style="display: none;">
                <div class="actuator-control-section">
                    <h4 class="control-title">Control Actuator</h4>
                    <div class="toggle-buttons-popup">
                        <button class="toggle-btn toggle-off" id="actuatorOffBtn">OFF</button>
                        <button class="toggle-btn toggle-on" id="actuatorOnBtn">ON</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="popup-buttons">
            <button class="btn btn-secondary" id="closeSensorButton">Close</button>
            <button class="btn btn-primary" id="showChartButton">View History</button>
        </div>
    </div>

    <!-- Chart Popup -->
    <div class="popup-overlay" id="chartPopupOverlay"></div>
    <div class="popup chart-popup" id="chartPopup">
        <div class="popup-header">
            <div class="popup-icon" id="chartPopupIcon"></div>
            <h2 class="popup-title" id="chartPopupTitle">Sensor History</h2>
        </div>
        <div class="popup-content">
            <div class="time-buttons">
                <button class="time-btn active" data-time-range="1h">1H</button>
                <button class="time-btn" data-time-range="6h">6H</button>
                <button class="time-btn" data-time-range="24h">24H</button>
                <button class="time-btn" data-time-range="7d">7D</button>
            </div>
            <div class="chart-container">
                <canvas id="sensorChart"></canvas>
            </div>
            <div class="sensor-info">
                <div class="info-item">
                    <div class="info-label">Average</div>
                    <div class="info-value" id="averageValue">--</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Maximum</div>
                    <div class="info-value" id="maxValue">--</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Minimum</div>
                    <div class="info-value" id="minValue">--</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Trend</div>
                    <div class="info-value" id="trendValue">--</div>
                </div>
            </div>
        </div>
        <div class="popup-buttons">
            <button class="btn btn-secondary" id="backToSensorButton">Back</button>
            <button class="btn btn-primary" id="closeChartButton">Close</button>
        </div>
    </div>

    <!-- PWA Install Banner -->
    <div id="installPrompt">
        <span>Install app for better experience</span>
        <button id="installButton">Install</button>
        <button id="dismissButton">No thanks</button>
    </div>


    <!-- JavaScript Files as ES Modules -->
    <script type="module">
        // Import dependencies
        import { authManager } from './js/auth.js';
        import { API_CONFIG } from './js/config.js';

        // Make available globally
        window.authManager = authManager;
        window.API_CONFIG = API_CONFIG;

        // Authentication check (after modules are loaded)
        async function checkAuthentication() {
            // 1. Check for OAuth callback (code) FIRST
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('code')) {
                console.log('OAuth code received, processing...');
                const code = urlParams.get('code');
                const state = urlParams.get('state');
                const storedState = sessionStorage.getItem('pkce_state');
                const codeVerifier = sessionStorage.getItem('pkce_code_verifier');

                // En dev local, on peut être plus souple si le state est perdu
                if (state === storedState || window.location.hostname === 'localhost') {
                    console.log('State validation passed (or skipped for localhost)');

                    // Exchange authorization code for cookie
                    const result = await authManager.handleCallback(code, codeVerifier);

                    if (result.success) {
                        // Clean up session storage
                        sessionStorage.removeItem('pkce_code_verifier');
                        sessionStorage.removeItem('pkce_state');
                        sessionStorage.removeItem('redirect_after_login');

                        // Clean up URL and reload without query parameters
                        const cleanUrl = window.location.origin + window.location.pathname;
                        window.history.replaceState({}, document.title, cleanUrl);

                        console.log('Authentication successful! Reloading app...');
                        window.location.reload();
                        return; // Stop execution here
                    } else {
                        console.error('Token exchange failed:', result.error);
                        alert('Authentication failed: ' + result.error);
                        // Clear URL and reload to restart flow cleanly
                        window.history.replaceState({}, document.title, window.location.pathname);
                        window.location.reload();
                        return;
                    }
                } else {
                    console.error('State mismatch! Possible CSRF attack.');
                    console.error('Received:', state);
                    console.error('Stored:', storedState);
                }
            }

            // 2. Check authentication before loading the main application
            // Wait for session check to complete
            const isAuthenticated = await authManager.checkSession();

            if (API_CONFIG.AUTH_REQUIRED && !isAuthenticated) {

                // Loop protection
                const loopCount = parseInt(sessionStorage.getItem('auth_loop_count') || '0');
                const lastLoopTime = parseInt(sessionStorage.getItem('auth_loop_time') || '0');
                const now = Date.now();

                if (now - lastLoopTime > 10000) {
                    // Reset counter if last attempt was > 10s ago
                    sessionStorage.setItem('auth_loop_count', '1');
                    sessionStorage.setItem('auth_loop_time', now.toString());
                } else {
                    if (loopCount > 3) {
                        console.error('🛑 Infinite redirect loop detected. Stopping.');
                        document.body.innerHTML = `
                            <div style="padding: 20px; text-align: center; color: white;">
                                <h1>Erreur d'authentification</h1>
                                <p>Une boucle de redirection a été détectée.</p>
                                <p>Impossible de vérifier la session (Cookie manquant ou invalide).</p>
                                <button onclick="sessionStorage.clear(); window.location.reload()">Réessayer</button>
                                <br><br>
                                <small>Ouvrez la console (F12) pour voir les détails.</small>
                            </div>
                        `;
                        throw new Error('Infinite redirect loop');
                    }
                    sessionStorage.setItem('auth_loop_count', (loopCount + 1).toString());
                    sessionStorage.setItem('auth_loop_time', now.toString());
                }

                // Redirect to IAM login using AuthManager
                console.log('User not authenticated, redirecting to IAM login...');
                // authManager.login(); // Disable auto-redirect for debugging if needed, but keep enabled for now

                // Show a temporary message before redirecting
                const statusDiv = document.createElement('div');
                statusDiv.style.position = 'fixed';
                statusDiv.style.top = '0';
                statusDiv.style.left = '0';
                statusDiv.style.width = '100%';
                statusDiv.style.background = 'rgba(255,0,0,0.8)';
                statusDiv.style.color = 'white';
                statusDiv.style.padding = '10px';
                statusDiv.style.textAlign = 'center';
                statusDiv.style.zIndex = '9999';
                statusDiv.innerText = 'Authentification requise. Redirection vers le login...';
                document.body.appendChild(statusDiv);

                setTimeout(() => {
                    authManager.login();
                }, 1000); // Wait 1s to see the message

                // Stop script execution to prevent loading the app
                throw new Error('Authentication required');
            } else {
                // Authenticated - reset loop counter
                sessionStorage.removeItem('auth_loop_count');
            }
        }

        // Run authentication check
        checkAuthentication();
    </script>

    <!-- Load MVP and Main app after auth check -->
    <script type="module" src="js/mvp.js"></script>
    <script type="module" src="js/main.js"></script>

    <!-- Service Worker Registration -->
    <script type="module">
        // Register Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', async () => {
                try {
                    const registration = await navigator.serviceWorker.register('sw.js');
                    console.log('✓ Service Worker enregistré avec succès:', registration.scope);
                } catch (error) {
                    console.error('✗ Échec de l\'enregistrement du Service Worker:', error);
                }
            });
        }

        // PWA Install Prompt
        let deferredPrompt;
        const installPrompt = document.getElementById('installPrompt');
        const installButton = document.getElementById('installButton');
        const dismissButton = document.getElementById('dismissButton');

        window.addEventListener('beforeinstallprompt', (e) => {
            // Empêcher la mini-barre d'information de s'afficher automatiquement
            e.preventDefault();
            // Stocker l'événement pour pouvoir le déclencher plus tard
            deferredPrompt = e;
            // Afficher notre propre UI d'installation
            installPrompt.style.display = 'flex';
        });

        installButton.addEventListener('click', async () => {
            if (!deferredPrompt) return;

            // Afficher la boîte de dialogue d'installation
            deferredPrompt.prompt();

            // Attendre la réponse de l'utilisateur
            const { outcome } = await deferredPrompt.userChoice;
            console.log(outcome === 'accepted' ? '✓ PWA installée' : '✗ Installation refusée');

            // Reset la variable car elle ne peut être utilisée qu'une fois
            deferredPrompt = null;
            installPrompt.style.display = 'none';
        });

        dismissButton.addEventListener('click', () => {
            installPrompt.style.display = 'none';
        });

        // Détecter si l'app est déjà installée
        window.addEventListener('appinstalled', () => {
            console.log('✓ PWA a été installée avec succès!');
            installPrompt.style.display = 'none';
        });
    </script>
</body>

</html>
