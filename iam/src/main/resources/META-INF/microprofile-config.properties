# ========== JWT Configuration ==========
jwt.realm=iam-realm
jwt.issuer=https://auth.example.com
jwt.lifetime.duration=3600

# ========== MongoDB Configuration ==========
jakarta.nosql.document.database=iam_database
jakarta.nosql.document.provider=org.eclipse.jnosql.databases.mongodb.mapping.MongoDBDocumentTemplate

# Connection String (simplest - no auth if MongoDB doesn't require it)
mongodb.connection-string=mongodb://localhost:27017

# Connection Pool Settings
mongodb.connections-per-host=50
mongodb.threads-allowed-to-block-for-connection-multiplier=5
mongodb.max-wait-time=120000
mongodb.connect-timeout=10000
mongodb.socket-timeout=0

# ========== Application Configuration ==========
roles=user,admin,manager,auditor

# ========== Optional: Advanced MongoDB Settings ==========
# mongodb.auto-index-creation=true
# mongodb.read-preference=primary
# mongodb.write-concern=acknowledged